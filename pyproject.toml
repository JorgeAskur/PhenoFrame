[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phenosuite"
version = "0.1.0"
description = "Procedural maize plant modeling and phenotyping trait computation"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Jorge Vazquez", email = "vazque81@purdue.edu" },
]
keywords = ["maize", "plant", "phenotyping", "procedural-modeling", "agriculture", "3d", "spline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]
# Skeleton -> descriptor conversion (phenosuite.skeleton_to_descriptor,
# phenosuite.skeleton_traits) needs the scientific stack; the core mesh/trait/
# generator API does not.
conversion = ["numpy>=1.24", "scipy>=1.10", "pandas>=2"]
examples = ["matplotlib>=3.7", "notebook>=7"]
experiments = [
    "matplotlib>=3.7",
    "notebook>=7",
    "pandas>=2",
    "openpyxl>=3",
    "scipy>=1.10",
    "numpy>=1.24",
]

[project.urls]
Repository = "https://github.com/JorgeAskur/PhenoSuite"
Issues = "https://github.com/JorgeAskur/PhenoSuite/issues"

[tool.setuptools.packages.find]
include = ["phenosuite*"]
exclude = ["MaizeModel*", "plants*", "tests*", "experiments*", "examples*"]

[tool.setuptools.package-data]
phenosuite = ["libs/*.dll", "libs/*.so", "libs/*.dylib", "schemas/*.xsd"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "wrapper: tests that require the compiled C++ shared library",
]
